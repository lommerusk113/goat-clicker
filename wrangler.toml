# Cloudflare Pages configuration. The site is the Vite build; `functions/` holds
# the cloud-save endpoint, which needs a KV namespace bound as SAVES.
#
# One-time setup:
#   npx wrangler kv namespace create SAVES
# then paste the id it prints below (or bind it in the dashboard under
# Workers & Pages -> goat-clicker -> Settings -> Bindings -> KV namespace).
name = "goat-clicker"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "SAVES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
